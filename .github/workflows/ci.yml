name: CI

# 分两层：
#   1) unit   —— 纯 Node 单测（test/*.test.js，零依赖，直接 node 跑）
#   2) build  —— 在 Windows 上真的组装一次便携版，并校验产物里装的是**当前源码**
#
# 重型 Electron 端到端测试（deploy/electron-test/run_all.js）不在这里跑：
# 它要真实窗口、真实 GPU 路径与人工可感知的时序，GitHub 的 windows-latest
# 是软件渲染 + 无交互会话，量出来的时间没有参考价值。那套测试留在本地/发布前跑。

on:
  push:
    branches: [main, 'fix/**', 'perf/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 单测（Node，零依赖）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 版本
        run: node --version && npm --version
      - name: 跑全部纯 Node 单测
        run: npm run test:unit

  build:
    name: Windows 组装校验
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 Electron 运行时（deploy/electron 下）
        working-directory: deploy/electron
        run: npm install --no-audit --no-fund
      - name: 组装便携版
        run: npm run build
      - name: 校验产物
        shell: pwsh
        run: |
          $exe = 'deploy/dist-electron/Atrium_Electron版/Atrium.exe'
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }
          $app = 'deploy/dist-electron/Atrium_Electron版/resources/app'
          foreach ($f in @('js/lightbox.js', 'js/thumb.js', 'js/state.js', 'main.js', 'pathauth.js')) {
            if (-not (Test-Path (Join-Path $app $f))) { throw "产物缺 $f" }
          }
          # 产物必须装的是**当前源码**：抽查几个只在本分支存在的实现标记。
          # 这一条专门挡"改了源码但构建用了旧 stage"这类事故。
          $checks = @(
            @{ file = 'js/thumb.js';     needle = 'screenPending' },
            @{ file = 'js/thumb.js';     needle = 'BG_CONC' },
            @{ file = 'js/lightbox.js';  needle = '_issueStrip' },
            @{ file = 'js/state.js';     needle = 'sourcePrefix' }
          )
          foreach ($c in $checks) {
            $p = Join-Path $app $c.file
            $txt = Get-Content $p -Raw
            if (-not $txt.Contains($c.needle)) { throw "$($c.file) 里找不到 $($c.needle)：产物没跟上源码" }
          }
          Write-Host '产物校验通过'
      - name: 上传构建戳
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: |
            deploy/dist-electron/BUILD-INFO.json
            deploy/electron/.stage/app/js/lightbox.js
          if-no-files-found: warn
          retention-days: 7
